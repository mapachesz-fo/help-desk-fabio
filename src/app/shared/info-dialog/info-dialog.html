<div class="dialogo">
  <div class="icono">
    <mat-icon>{{ data.icono ?? 'warning_amber' }}</mat-icon>
  </div>

  <h2 mat-dialog-title>
    {{ data.titulo }}
  </h2>

  <mat-dialog-content>
    <p>
      {{ data.mensaje }}
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button mat-stroked-button type="button" (click)="cerrar()">
      {{ data.textoCerrar ?? 'Cerrar' }}
    </button>
  </mat-dialog-actions>
</div>
